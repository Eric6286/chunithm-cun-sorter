name: Release

# 推 v* tag 触发：在 Windows runner 上跑测试、打 exe、出安装包，
# 连同 DGHub 插件 zip 一起发 GitHub Release。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to build (e.g. v2.0)"
        required: true
        default: "v2.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.tag }}" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          # 版本号的唯一真源是 core/version.py，这里读回来对齐产物名
          $v = (Select-String -Path core/version.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build installer
        run: python packaging/build.py --skip-tests

      - name: Package DGHub plugin
        id: pack
        shell: pwsh
        run: |
          $plugin = "cun_dghub_plugin_${{ steps.ver.outputs.tag }}.zip"
          Compress-Archive -Path dghub-plugin/* -DestinationPath $plugin -Force
          "plugin=$plugin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $setup = (Get-ChildItem dist_installer/*.exe | Select-Object -First 1).FullName
          "setup=$setup" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 寸录 ${{ steps.ver.outputs.tag }}
          body: |
            ## 寸录 ${{ steps.ver.outputs.tag }}

            CHUNITHM「寸」成绩自动识别与归档工具。Python + PySide6，自包含安装包，**不需要装 Python**。

            ### 安装
            1. 下载下方的安装程序，双击。
            2. 安装向导会问 **CHUNITHM 装在哪**：选中游戏根目录（里面有 `bin` 文件夹的那一层）。它会先猜一个常见位置，不对就点「浏览」；留空的话第一次打开程序时还会再问。
            3. 装完打开，「配置」页添加判定规则、按需开启整理，保存。

            程序装在 `%LOCALAPPDATA%\Programs\寸录\`，**不需要**放进游戏目录；配置和统计数据在 `%LOCALAPPDATA%\ChunithmCunSorter\`。

            ### 环境
            - Windows 10 1809+ / 11，x64
            - 截图分辨率 1920×1080
            - 走截图 + OCR 这条路需要 [Tesseract OCR](https://github.com/UB-Mannheim/tesseract/wiki)；只用联动 + 自动截图的话新成绩不需要它

            ### DGHub 联动（可选）
            下载 `cun_dghub_plugin_${{ steps.ver.outputs.tag }}.zip`，在 DGHub「插件中心 → 外部插件 → 导入 zip 包」安装；波形 / 强度在 DGHub 插件配置页调节，cun 侧只需在「配置 → DGHub 联动」开启。

            详见仓库 [README](https://github.com/ErikaAlk/chunithm-cun-sorter#readme) 与[更新记录](https://github.com/ErikaAlk/chunithm-cun-sorter/blob/main/更新记录.md)。
          files: |
            ${{ steps.pack.outputs.setup }}
            ${{ steps.pack.outputs.plugin }}
