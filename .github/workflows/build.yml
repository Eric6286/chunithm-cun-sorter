name: Build

# 在 Windows runner 上跑测试并打一次 exe，验证代码和打包配置都还是好的。
# （OCR 的真实识别效果、托盘、内存读取仍需在本机手动确认。）

on:
  push:
    branches: ["**"]
    paths:
      - "core/**"
      - "ui/**"
      - "tests/**"
      - "packaging/**"
      - "main.py"
      - "cli.py"
      - "requirements.txt"
      - ".github/workflows/build.yml"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      # runner 的控制台是 cp1252，中文输出会让工具直接抛 UnicodeEncodeError
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests -q

      # runner 上没有 Inno Setup，只打 exe。跑冒烟：打包成功不等于跑得起来，
      # 少一个隐藏依赖就是双击没反应，这一步能当场发现。
      - name: Build exe (with startup smoke test)
        run: python packaging/build.py --skip-tests --no-installer
