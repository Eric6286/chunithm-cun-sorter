name: Build

# 在 Windows runner 上编译 WinUI 3 / .NET 8 版,验证 C#/XAML 能否通过编译。
# (真机的 OCR 识别效果 / Mica / 托盘运行时表现仍需在本机手动确认。)

on:
  push:
    branches: ["**"]
    paths:
      - "CunSorter/**"
      - "CunSorter.sln"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "CunSorter/**"
      - "CunSorter.sln"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore CunSorter/CunSorter.csproj -r win-x64

      - name: Build (Release, x64, self-contained)
        run: dotnet build CunSorter/CunSorter.csproj -c Release -p:Platform=x64 -r win-x64 --no-restore
